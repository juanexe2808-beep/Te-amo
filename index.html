<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Día de las Flores Amarillas 🌻</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: #000;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            color: white;
        }

        /* ==========================================
           PANTALLA DE INICIO
           ========================================== */
        #pantallaInicio {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1.5s ease;
            cursor: pointer;
        }

        #pantallaInicio.oculto {
            opacity: 0;
            pointer-events: none;
        }

        .girasol-inicio {
            font-size: 100px;
            filter: drop-shadow(0 0 30px #ffd700) drop-shadow(0 0 60px #ffaa00);
            animation: brillar 2s infinite;
            margin-bottom: 30px;
        }

        @keyframes brillar {
            0%, 100% { filter: drop-shadow(0 0 30px #ffd700) drop-shadow(0 0 60px #ffaa00); }
            50% { filter: drop-shadow(0 0 50px #ffd700) drop-shadow(0 0 100px #ffaa00); }
        }

        .texto-inicio {
            color: #ffd700;
            font-size: 32px;
            font-weight: 300;
            text-shadow: 0 0 20px #ffd700;
            letter-spacing: 3px;
            font-family: 'Courier New', monospace;
        }

        /* ==========================================
           GALAXIA PRINCIPAL
           ========================================== */
        #galaxia {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, 
                #1a0a00 0%, 
                #0a0500 40%, 
                #000000 100%);
            overflow: hidden;
            opacity: 0;
            transition: opacity 2s ease;
        }

        #galaxia.visible {
            opacity: 1;
        }

        /* Estrellas */
        .estrella {
            position: absolute;
            background: #ffd700;
            border-radius: 50%;
            animation: titilar 3s infinite;
        }

        @keyframes titilar {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }

        /* ==========================================
           AGUJERO NEGRO CON ANILLO DORADO
           ========================================== */
        .agujero-negro {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            z-index: 10;
        }

        /* Elipse del anillo (efecto 3D) */
        .anillo-elipse {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateX(75deg);
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: radial-gradient(ellipse, 
                rgba(255, 215, 0, 0.9) 0%, 
                rgba(255, 170, 0, 0.6) 40%,
                rgba(255, 100, 0, 0.2) 60%,
                transparent 80%);
            filter: blur(8px);
            animation: rotarAnillo 20s linear infinite;
        }

        @keyframes rotarAnillo {
            from { transform: translate(-50%, -50%) rotateX(75deg) rotateZ(0deg); }
            to { transform: translate(-50%, -50%) rotateX(75deg) rotateZ(360deg); }
        }

        /* Bola negra central */
        .bola-negra {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 130px;
            height: 130px;
            background: radial-gradient(circle at 40% 30%, #333 0%, #000 40%, #000 100%);
            border-radius: 50%;
            box-shadow: 
                0 0 40px 20px rgba(255, 215, 0, 0.5),
                0 0 80px 40px rgba(255, 170, 0, 0.3);
            z-index: 2;
        }

        /* Flor central sobre el agujero */
        .flor-central {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 60px;
            z-index: 3;
            filter: drop-shadow(0 0 20px #ffd700);
            animation: balanceoCentral 3s ease-in-out infinite;
        }

        @keyframes balanceoCentral {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -55%) scale(1.05); }
        }

        /* Brillo extra */
        .brillo-agujero {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: radial-gradient(circle, 
                rgba(255, 215, 0, 0.3) 0%, 
                transparent 70%);
            filter: blur(20px);
            z-index: 1;
            animation: pulsoBrillo 4s ease-in-out infinite;
        }

        @keyframes pulsoBrillo {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        /* ==========================================
           FLORES ORBITANDO
           ========================================== */
        .flor-orbitando {
            position: absolute;
            top: 50%;
            left: 50%;
            font-size: 35px;
            cursor: pointer;
            user-select: none;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.9));
            transition: transform 0.3s;
            z-index: 15;
        }

        .flor-orbitando:hover {
            filter: drop-shadow(0 0 25px #ffd700) drop-shadow(0 0 40px #ffaa00);
        }

        /* ==========================================
           MENSAJES FLOTANTES
           ========================================== */
        .mensaje-flotante {
            position: absolute;
            color: #ffd700;
            font-size: 13px;
            font-weight: 300;
            text-shadow: 0 0 10px #ffd700, 0 0 20px #ffaa00;
            white-space: nowrap;
            pointer-events: none;
            z-index: 5;
            opacity: 0.8;
            animation: flotarMensaje 6s ease-in-out infinite;
            font-family: 'Georgia', serif;
        }

        @keyframes flotarMensaje {
            0%, 100% { transform: translateY(0px); opacity: 0.6; }
            50% { transform: translateY(-15px); opacity: 1; }
        }

        /* ==========================================
           TÍTULO PRINCIPAL
           ========================================== */
        .titulo-principal {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffd700;
            font-size: 28px;
            font-weight: 300;
            text-shadow: 0 0 20px #ffd700, 0 0 40px #ffaa00;
            z-index: 50;
            text-align: center;
            letter-spacing: 2px;
            font-family: 'Courier New', monospace;
        }

        /* ==========================================
           MENSAJE EMERGENTE (al tocar una flor)
           ========================================== */
        .mensaje-emergente {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(20, 10, 0, 0.95);
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 30px 40px;
            color: #fff;
            font-size: 18px;
            text-align: center;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.8);
            z-index: 100;
            max-width: 90%;
            transition: transform 0.4s ease;
            backdrop-filter: blur(10px);
        }

        .mensaje-emergente.visible {
            transform: translate(-50%, -50%) scale(1);
        }

        .mensaje-emergente .texto {
            color: #ffd700;
            font-weight: bold;
            text-shadow: 0 0 10px #ffd700;
            line-height: 1.6;
        }

        .mensaje-emergente .cerrar {
            margin-top: 20px;
            padding: 10px 25px;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            color: #1a0a00;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }

        /* ==========================================
           BOTÓN DE MÚSICA
           ========================================== */
        #btnMusica {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 215, 0, 0.2);
            border: 2px solid #ffd700;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 24px;
            cursor: pointer;
            z-index: 1000;
            color: #ffd700;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #btnMusica:hover {
            background: rgba(255, 215, 0, 0.4);
            transform: scale(1.1);
        }

        @media (max-width: 480px) {
            .girasol-inicio { font-size: 80px; }
            .texto-inicio { font-size: 24px; }
            .titulo-principal { font-size: 20px; }
            .bola-negra { width: 100px; height: 100px; }
            .anillo-elipse { width: 250px; height: 250px; }
            .flor-central { font-size: 45px; }
            .flor-orbitando { font-size: 28px; }
            .mensaje-flotante { font-size: 11px; }
            .mensaje-emergente { font-size: 15px; padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- ==========================================
         PANTALLA DE INICIO
         ========================================== -->
    <div id="pantallaInicio">
        <div class="girasol-inicio">🌻</div>
        <div class="texto-inicio">Toca para iniciar</div>
    </div>

    <!-- ==========================================
         GALAXIA
         ========================================== -->
    <div id="galaxia">
        <!-- Agujero negro con anillo -->
        <div class="agujero-negro">
            <div class="brillo-agujero"></div>
            <div class="anillo-elipse"></div>
            <div class="bola-negra"></div>
            <div class="flor-central">💐</div>
        </div>
        
        <!-- Título -->
        <div class="titulo-principal">Feliz Día de las Flores Amarillas 🌻</div>
    </div>

    <!-- Mensaje emergente -->
    <div class="mensaje-emergente" id="mensajeEmergente">
        <div class="texto" id="textoMensaje">¡Te amo mucho!</div>
        <button class="cerrar" onclick="cerrarMensaje()">Cerrar 💛</button>
    </div>

    <!-- Botón de música -->
    <button id="btnMusica">🔇</button>

    <!-- Audio -->
    <audio id="musicaFondo" loop preload="auto">
        <source src="musica.mp3.mp3" type="audio/mpeg">
    </audio>

    <script>
        // ==========================================
        // MENSAJES PERSONALIZADOS (sin nombres)
        // ==========================================
        const mensajesEmergentes = [
            "🌻 Eres mi girasol favorito, la que ilumina mis días.",
            "💛 Cada vez que te veo, mi corazón florece como estas flores.",
            "🌻 Eres lo más bonito que me ha pasado en la vida.",
            "💛 Te amo más de lo que las palabras pueden expresar.",
            "🌻 Eres mi persona favorita en todo el universo.",
            "💛 Contigo aprendí que el amor verdadero sí existe.",
            "🌻 Cada día a tu lado es un regalo que atesoro.",
            "💛 Tu sonrisa ilumina hasta mis días más grises.",
            "🌻 Si pudiera pedir un deseo, sería pasar toda mi vida contigo.",
            "💛 Eres mi pensamiento favorito al despertar y al dormir.",
            "🌻 Te elegiría una y mil veces más.",
            "💛 Gracias por ser tú, tan única y tan maravillosa."
        ];

        // ==========================================
        // MENSAJES FLOTANTES (frases cortas esparcidas)
        // ==========================================
        const frasesFlotantes = [
            "Tu cariño no pasa de moda",
            "Tu risa ilumina mis días",
            "Contigo todo es mejor",
            "Contigo hasta lo simple brilla",
            "Un ramo de flores para ti",
            "Eres mi lugar favorito",
            "Hoy el amor lleva tu nombre",
            "Contigo todo tiene sentido",
            "Tus detalles valen más que mil palabras",
            "Siempre tienes un lugar aquí",
            "Un girasol para quien ilumina",
            "Como el girasol, miro hacia ti",
            "Contigo las tardes se hacen cortas",
            "Gracias por ser luz en mis días",
            "Eres mi pensamiento de cada mañana",
            "A tu lado todo florece",
            "Cada momento contigo es especial",
            "Tu presencia hace todo mejor",
            "Eres la razón de mis sonrisas",
            "Mi corazón late por ti",
            "Contigo aprendí a querer bonito",
            "Eres mi persona favorita",
            "Te elijo hoy y siempre",
            "Gracias por existir",
            "Eres mi todo, mi amor"
        ];

        const galaxia = document.getElementById("galaxia");
        const pantallaInicio = document.getElementById("pantallaInicio");
        const musica = document.getElementById("musicaFondo");
        const btnMusica = document.getElementById("btnMusica");
        let musicaActiva = false;
        let galaxiaIniciada = false;

        // ==========================================
        // INICIAR GALAXIA AL TOCAR
        // ==========================================
        pantallaInicio.addEventListener("click", () => {
            pantallaInicio.classList.add("oculto");
            galaxia.classList.add("visible");
            
            // Iniciar música
            musica.volume = 0.4;
            musica.play().then(() => {
                musicaActiva = true;
                btnMusica.textContent = "🔊";
            }).catch(err => console.log("Música bloqueada:", err));
            
            // Crear elementos
            if (!galaxiaIniciada) {
                crearEstrellas();
                crearMensajesFlotantes();
                crearFloresOrbitando();
                galaxiaIniciada = true;
            }
        });

        // Botón de música
        btnMusica.addEventListener("click", (e) => {
            e.stopPropagation();
            if (musicaActiva) {
                musica.pause();
                musicaActiva = false;
                btnMusica.textContent = "🔇";
            } else {
                musica.play();
                musicaActiva = true;
                btnMusica.textContent = "🔊";
            }
        });

        // ==========================================
        // CREAR ESTRELLAS
        // ==========================================
        function crearEstrellas() {
            for (let i = 0; i < 200; i++) {
                const estrella = document.createElement("div");
                estrella.classList.add("estrella");
                estrella.style.left = Math.random() * 100 + "%";
                estrella.style.top = Math.random() * 100 + "%";
                const tamano = Math.random() * 2 + 1;
                estrella.style.width = tamano + "px";
                estrella.style.height = tamano + "px";
                estrella.style.animationDelay = Math.random() * 3 + "s";
                galaxia.appendChild(estrella);
            }
        }

        // ==========================================
        // CREAR MENSAJES FLOTANTES
        // ==========================================
        function crearMensajesFlotantes() {
            const posiciones = [];
            
            // Generar posiciones aleatorias sin solaparse demasiado
            frasesFlotantes.forEach((frase, index) => {
                const mensaje = document.createElement("div");
                mensaje.classList.add("mensaje-flotante");
                mensaje.textContent = frase;
                
                let left, top, intentos = 0;
                do {
                    left = Math.random() * 80 + 5;
                    top = Math.random() * 85 + 5;
                    intentos++;
                } while (posiciones.some(p => 
                    Math.abs(p.left - left) < 15 && Math.abs(p.top - top) < 8
                ) && intentos < 50);
                
                posiciones.push({ left, top });
                
                mensaje.style.left = left + "%";
                mensaje.style.top = top + "%";
                mensaje.style.animationDelay = (Math.random() * 3) + "s";
                mensaje.style.animationDuration = (Math.random() * 3 + 4) + "s";
                
                galaxia.appendChild(mensaje);
            });
        }

        // ==========================================
        // CREAR FLORES ORBITANDO
        // ==========================================
        function crearFloresOrbitando() {
            const cantidadFlores = mensajesEmergentes.length;
            const radioOrbita = 180;
            
            for (let i = 0; i < cantidadFlores; i++) {
                const flor = document.createElement("div");
                flor.classList.add("flor-orbitando");
                
                // Alternar entre diferentes tipos de flores
                const tiposFlores = ["🌻", "💐", "🌼", "🌻", "💐"];
                flor.textContent = tiposFlores[i % tiposFlores.length];
                
                const anguloInicial = (360 / cantidadFlores) * i;
                let angulo = anguloInicial;
                const velocidad = 0.15; // grados por frame
                
                // Radio ligeramente variable para efecto orgánico
                const radioVariacion = radioOrbita + (Math.random() * 40 - 20);
                
                function orbitar() {
                    angulo += velocidad;
                    const x = Math.cos(angulo * Math.PI / 180) * radioVariacion;
                    const y = Math.sin(angulo * Math.PI / 180) * radioVariacion * 0.4; // Aplanado para efecto 3D
                    
                    flor.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
                    flor.style.zIndex = Math.floor(y + 100);
                    requestAnimationFrame(orbitar);
                }
                orbitar();
                
                flor.addEventListener("click", (e) => {
                    e.stopPropagation();
                    mostrarMensaje(i % mensajesEmergentes.length);
                });
                
                galaxia.appendChild(flor);
            }
        }

        // ==========================================
        // MOSTRAR MENSAJE EMERGENTE
        // ==========================================
        function mostrarMensaje(indice) {
            document.getElementById("textoMensaje").textContent = mensajesEmergentes[indice];
            document.getElementById("mensajeEmergente").classList.add("visible");
            crearExplosionDorada();
        }

        function cerrarMensaje() {
            document.getElementById("mensajeEmergente").classList.remove("visible");
        }

        // ==========================================
        // EXPLOSIÓN DORADA
        // ==========================================
        function crearExplosionDorada() {
            for (let i = 0; i < 20; i++) {
                const particula = document.createElement("div");
                particula.style.position = "fixed";
                particula.style.left = "50%";
                particula.style.top = "50%";
                particula.style.width = "5px";
                particula.style.height = "5px";
                particula.style.background = "#ffd700";
                particula.style.borderRadius = "50%";
                particula.style.boxShadow = "0 0 15px #ffd700, 0 0 30px #ffd700";
                particula.style.transition = "all 1.2s ease-out";
                particula.style.zIndex = "200";
                particula.style.pointerEvents = "none";
                
                document.body.appendChild(particula);
                
                const angulo = Math.random() * Math.PI * 2;
                const distancia = Math.random() * 250 + 100;
                const x = Math.cos(angulo) * distancia;
                const y = Math.sin(angulo) * distancia;
                
                setTimeout(() => {
                    particula.style.transform = `translate(${x}px, ${y}px)`;
                    particula.style.opacity = "0";
                }, 10);
                
                setTimeout(() => particula.remove(), 1500);
            }
        }
    </script>

</body>
</html>
